name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 手動重新部署：Actions → ci → Run workflow（main）
  workflow_dispatch:

permissions:
  contents: read
  # 部署的變更偵測要查過去的 run 是否真的部署過
  actions: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockwise
          POSTGRES_PASSWORD: stockwise
          POSTGRES_DB: stockwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockwise -d stockwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: test-key
      FINMIND_TOKEN: test-token
      DATABASE_URL: sqlite:///./test.db
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r requirements.lock
      # ruff 鎖版本：未鎖的話 lint 工具一發新版就可能讓 CI 在沒有任何
      # 程式碼變更的情況下變紅（0.16.0 擴大預設規則集時就發生過）
      - run: pip install pytest pytest-asyncio pytest-cov ruff==0.16.0 pip-audit
      - run: pytest -q
      - run: ruff check app tests alembic
      - name: PostgreSQL migration smoke
        env:
          DATABASE_URL: postgresql+psycopg://stockwise:stockwise@localhost:5432/stockwise_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run build
      # 阻擋門檻只看正式環境相依：dev 工具鏈（eslint 全家）的漏洞不會被
      # 打包進 next build 的產出，碰不到部署出去的東西。
      #
      # 註：先前這裡記載 brace-expansion「無法單獨修補」（修補版只在 5.x，
      # 強制 override 會讓 minimatch@3 拿到物件而非函式）。1.1.18 釋出後已
      # 不成立——package.json 的 overrides 以版本範圍為 key，讓 1.x 與 5.x
      # 兩條相依鏈各自升到自己分支的修補版，毋須動 eslint 版本。
      - run: npm audit --omit=dev --audit-level=high
      # dev 相依仍然掃，只是不擋 CI：供應鏈攻擊會在 CI 與開發機上執行，
      # 不能因為上游一時無解就完全失去能見度。紅字要看，別當背景雜訊。
      - name: npm audit (dev dependencies, warning only)
        continue-on-error: true
        run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stockwise-backend ./backend
      - run: docker build -t stockwise-frontend ./frontend

  # 後端自動部署到 VPS（前端由 Vercel 自己部署）。只有 main 的 push、
  # 且後端測試與映像建置都通過才會跑；VPS 端的流程見 deploy/vps/deploy.sh。
  deploy-backend:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 40   # VPS 端最多等執行中的工作 20 分鐘，再加建置時間
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      VPS_HOST: 43.153.138.225
      # 主機公鑰不是機密；寫死在這裡，主機被換掉時連線會直接失敗而不是誤連
      VPS_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAm6Dhi+IKA6ZvewA77kUEDGj0htx4Aq4bH/CNz/+Exn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 只改文件或前端時不必重啟後端（重啟會讓排程中的工作多等一輪）。
      # 比較基準是「上一次真的部署成功的版本」，不是上一次 push：CI 失敗的 push 不會部署，
      # 若只跟上一次 push 比，那些 push 裡的後端變更會在下一次只改文件的 push 被當成
      # 「沒變更」而永遠不上線，job 還照樣顯示成功（同機的 Twitch 專案實際踩過）
      - name: Detect backend changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "手動觸發，直接部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          base=""
          runs=$(curl -fsSL -H "$auth" "$api/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" \
            | jq -r '.workflow_runs[] | "\(.id) \(.head_sha)"') || runs=""
          # 只看 run 或 job 成功不夠：沒有後端變更時 job 成功但部署步驟是 skipped
          while read -r run_id sha; do
            [ -n "$run_id" ] || continue
            deployed=$(curl -fsSL -H "$auth" "$api/actions/runs/$run_id/jobs" \
              | jq '[.jobs[] | select(.name == "deploy-backend") | .steps[]
                     | select(.name == "Deploy to VPS" and .conclusion == "success")] | length') || deployed=0
            if [ "${deployed:-0}" -gt 0 ]; then
              base=$sha
              break
            fi
          done <<EOF
          $runs
          EOF
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "找不到上一次成功部署的版本，部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "$GITHUB_SHA" -- backend deploy/vps; then
            echo "自上次部署（$base）以來 backend/ 與 deploy/vps/ 沒有變更，略過部署"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "自上次部署（$base）以來有後端變更，部署"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to VPS
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::未設定 repo secret VPS_DEPLOY_KEY，無法部署"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VPS_HOST $VPS_HOST_KEY" > ~/.ssh/known_hosts
          echo "$GITHUB_SHA" > REVISION
          # 這把金鑰在 VPS 上被 forced command 綁死，只能把 tar 交給
          # deploy_entry.sh，不能執行任意指令
          git archive --format=tar --add-file=REVISION HEAD backend deploy/vps \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@"$VPS_HOST"
